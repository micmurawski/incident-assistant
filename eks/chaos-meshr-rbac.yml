# Chaos Mesh RBAC: grants the robot IAM user and a dedicated service account access to Chaos Mesh and core resources.
# EKS maps IAM users to Kubernetes usernames as their full ARN.
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: role-cluster-manager-zqqat
rules:
- apiGroups: [""]
  resources: ["pods", "namespaces"]
  verbs: ["get", "watch", "list"]
- apiGroups: ["chaos-mesh.org"]
  resources: [ "*" ]
  verbs: ["get", "list", "watch", "create", "delete", "patch", "update"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bind-cluster-manager-zqqat
subjects:
# Robot IAM user only (EKS STANDARD access entry username = principal ARN)
- kind: User
  name: "arn:aws:iam::189429133920:user/robot"
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: role-cluster-manager-zqqat
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: account-cluster-manager-zqqat
  namespace: bastion

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bind-sa-cluster-manager-zqqat
subjects:
- kind: ServiceAccount
  name: account-cluster-manager-zqqat
  namespace: bastion
roleRef:
  kind: ClusterRole
  name: role-cluster-manager-zqqat
  apiGroup: rbac.authorization.k8s.io
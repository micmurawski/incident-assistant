# Schedule Chaos Mesh on the bastion/monitoring node (alongside Linkerd Viz, Prometheus, etc.)
# Matches aws/main.tf observability node: role=bastion, taint dedicated=bastion:NO_SCHEDULE

controllerManager:
  nodeSelector:
    kubernetes.io/os: linux
    role: bastion
  tolerations:
    - key: dedicated
      operator: Equal
      value: bastion
      effect: NoSchedule

# chaos-daemon is a DaemonSet - must run on ALL nodes (including app node) for chaos injection.
# Only add tolerations so it can schedule on tainted bastion; no nodeSelector.
chaosDaemon:
  nodeSelector:
    kubernetes.io/os: linux
    role: bastion
  tolerations:
    - key: dedicated
      operator: Equal
      value: bastion
      effect: NoSchedule

dashboard:
  nodeSelector:
    kubernetes.io/os: linux
    role: bastion
  tolerations:
    - key: dedicated
      operator: Equal
      value: bastion
      effect: NoSchedule

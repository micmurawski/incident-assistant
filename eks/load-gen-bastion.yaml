# Load generator in bastion namespace; targets Robot Shop web in application namespace.
# Apply with: envsubst < load-gen-bastion.yaml | kubectl apply -f -
# Or set REPO/TAG and kubectl apply -f load-gen-bastion.yaml (if your tool substitutes them).
---
apiVersion: v1
kind: Namespace
metadata:
  name: bastion
  labels:
    name: bastion
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-gen
  namespace: bastion
spec:
  replicas: 1
  selector:
    matchLabels:
      app: load-gen
  template:
    metadata:
      labels:
        app: load-gen
    spec:
      # Schedule on bastion node group (matches EKS node group with role=bastion)
      nodeSelector:
        role: bastion
      tolerations:
        - key: dedicated
          operator: Equal
          value: bastion
          effect: NoSchedule
      containers:
        - name: load-gen
          image: ${REPO}/robot-shop-load-gen:${TAG}
          env:
            - name: HOST
              value: "http://web.application.svc.cluster.local:8080/"
            - name: NUM_CLIENTS
              value: "5"
            - name: RUN_TIME
              value: "0"
            - name: ERROR
              value: "0"
            - name: SILENT
              value: "1"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"

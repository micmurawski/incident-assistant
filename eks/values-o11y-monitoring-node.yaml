# Schedule o11y stack on the dedicated bastion node (EKS).
# Matches aws/main.tf: observability node group has label role=bastion
# and taint dedicated=bastion:NO_SCHEDULE.
#
# Use with deploy-o11y-stack.sh when targeting EKS (e.g. DEPLOY_ON_MONITORING_NODE=1).

# --- Loki stack (Grafana / Loki / Promtail) ---
# Subcharts use different keys; set common placement for all components.

proxy:
  controlPlaneNamespace: bastion
identityTrustDomain: cluster.local
prometheus:
  enabled: false

grafana:
  enabled: true
  adminPassword: admin
  service:
    type: LoadBalancer
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
      - name: Loki
        type: loki
        access: proxy
        url: http://loki:3100
        isDefault: true
      - name: Linkerd Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.bastion.svc.cluster.local:9090
        isDefault: false
        jsonData:
          timeInterval: 5s
  nodeSelector:
    role: bastion
  tolerations:
    - key: dedicated
      operator: Equal
      value: bastion
      effect: NoSchedule

loki:
  isDefault: false
  nodeSelector:
    kubernetes.io/os: linux
    role: bastion
  tolerations:
    - key: dedicated
      operator: Equal
      value: bastion
      effect: NoSchedule

# Promtail MUST run on ALL nodes (DaemonSet) to collect logs from every pod.
# Do NOT restrict to bastion node - sample-app runs on apps node.
promtail:
  enabled: true
  nodeSelector: {}
  tolerations: []

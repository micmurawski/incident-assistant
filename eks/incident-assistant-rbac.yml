# RBAC for incident-assistant IAM user: view nodes (and other cluster-scoped read if needed).
# EKS maps IAM users to Kubernetes usernames as their full ARN.
# Apply as cluster admin: kubectl apply -f eks/incident-assistant-rbac.yml
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: incident-assistant-view-nodes
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: incident-assistant-view-nodes
subjects:
- kind: User
  name: "arn:aws:iam::189429133920:user/incident-assistant"
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: incident-assistant-view-nodes
  apiGroup: rbac.authorization.k8s.io

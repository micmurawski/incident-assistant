# RBAC for incident-assistant IAM user: view nodes, manage namespaces and persistentvolumes;
# workload access only in allowed namespaces (e.g. application), NOT in bastion.
# EKS maps IAM users to Kubernetes usernames as their full ARN.
# Apply as cluster admin: kubectl apply -f eks/incident-assistant-rbac.yml
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: incident-assistant-view-nodes
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["metrics.k8s.io"]
  resources: ["nodes"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["create", "get", "list", "watch", "update", "patch"]
- apiGroups: [""]
  resources: ["persistentvolumes"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# CSI / block volume: VolumeAttachment is cluster-scoped (maps PV <-> node).
- apiGroups: ["storage.k8s.io"]
  resources: ["volumeattachments"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: incident-assistant-view-nodes
subjects:
- kind: User
  name: "arn:aws:iam::189429133920:user/incident-assistant"
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: incident-assistant-view-nodes
  apiGroup: rbac.authorization.k8s.io
---
# Namespace-scoped workload access: bind only in namespaces incident-assistant may use.
# No RoleBinding in bastion → user cannot get/list pods or other resources in bastion.
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: incident-assistant-namespace-workloads
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log", "services", "configmaps", "secrets", "persistentvolumeclaims", "events"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets", "statefulsets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# AWS Load Balancer Controller CRDs (not covered by AmazonEKSEditPolicy)
- apiGroups: ["networking.k8s.aws"]
  resources: ["applicationnetworkpolicies"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# Linkerd policy CRDs
- apiGroups: ["policy.linkerd.io"]
  resources: ["servers", "serverauthorizations", "authorizationpolicies"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["linkerd.io"]
  resources: ["serviceprofiles"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: incident-assistant-workloads
  namespace: application
subjects:
- kind: User
  name: "arn:aws:iam::189429133920:user/incident-assistant"
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: incident-assistant-namespace-workloads
  apiGroup: rbac.authorization.k8s.io

scenarios:
- id: chaos-user-pod-failure-2128
  class: 1
  service: user
  chaos_method: chaos_pod_failure
  chaos_params:
    duration: 15m
    mode: all
    namespace: robot-shop
    label_selector: app=user
  description: 'Class 1 Chaos: Simulate pod failure for a duration. on user'
  post_mortem:
    root_cause: 'Infrastructure issue: Simulate pod failure for a duration. applied
      to service ''user''.'
    fix: Investigate why pods for 'user' are failing; check for active PodChaos experiments.
- id: chaos-shipping-delay-6113
  class: 1
  service: shipping
  chaos_method: chaos_network_delay
  chaos_params:
    latency: 10m
    jitter: 0ms
    duration: 15m
    namespace: robot-shop
    label_selector: app=shipping
  description: 'Class 1 Chaos: Add network latency to pods. on shipping'
  post_mortem:
    root_cause: 'Infrastructure issue: Add network latency to pods. applied to service
      ''shipping''.'
    fix: Check NetworkChaos resources in namespace 'robot-shop' and delete the one
      targeting 'app=shipping'.

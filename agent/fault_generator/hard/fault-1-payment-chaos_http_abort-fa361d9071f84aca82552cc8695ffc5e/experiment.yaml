apiVersion: chaos-mesh.org/v1alpha1
kind: HTTPChaos
metadata:
  name: chaos-http-abort-application
  namespace: application
spec:
  action: abort
  mode: one
  selector:
    namespaces:
      - application
    labelSelectors:
      app: payment
  port: 8080
  duration: "5m"
  replace:
    code: 503
    body: "Service is currently unavailable"

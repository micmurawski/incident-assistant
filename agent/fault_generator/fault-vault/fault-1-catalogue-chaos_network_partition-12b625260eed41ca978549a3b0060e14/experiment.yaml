apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: chaos-network-partition-application
  namespace: application
spec:
  action: partition
  mode: one
  selector:
    namespaces:
      - application
    labelSelectors:
      app: catalogue
  direction: to
  target:
    selector:
      namespaces:
        - application
      labelSelectors:
        app: catalogue
    mode: one
  duration: "60m"

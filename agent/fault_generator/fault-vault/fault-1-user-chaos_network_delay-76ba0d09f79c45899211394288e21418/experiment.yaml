apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: chaos-network-delay-application
  namespace: application
spec:
  action: delay
  mode: one
  selector:
    namespaces:
      - application
    labelSelectors:
      app: user
  delay:
    latency: "500ms"
    correlation: "100"
    jitter: "50ms"
  duration: "60m"

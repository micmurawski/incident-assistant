[project]
name = "agent"
version = "0.1.0"
description = ""
authors = [
    {name = "Michał Murawski",email = "mmurawski777@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "tree-sitter (>=0.25.2,<0.26.0)",
    "tree-sitter-python (>=0.25.0,<0.26.0)",
    "tree-sitter-go (>=0.25.0,<0.26.0)",
    "tree-sitter-javascript (>=0.25.0,<0.26.0)",
    "tree-sitter-typescript (>=0.23.2,<0.24.0)",
    "tree-sitter-java (>=0.23.5,<0.24.0)",
    "tree-sitter-php (>=0.24.1,<0.25.0)",
    "qdrant-client (>=1.15.1,<2.0.0)",
    "ollama (>=0.6.0,<0.7.0)",
    "openai (>=1.109.1,<2.0.0)",
    "anthropic (>=0.68.1,<0.69.0)",
    "google-generativeai (>=0.8.5,<0.9.0)",
    "google-genai (>=1.40.0,<2.0.0)",
    "aiohttp (>=3.12.15,<4.0.0)",
    "tree-sitter-toml (>=0.7.0,<0.8.0)",
    "mermaid-py (>=0.8.0,<0.9.0)",
    "tiktoken (>=0.12.0,<0.13.0)",
    "peewee (>=3.18.2,<4.0.0)",
    "aiofiles (>=25.1.0,<26.0.0)",
    "docker (>=7.1.0,<8.0.0)",
    "opentelemetry-api (>=1.20.0,<2.0.0)",
    "opentelemetry-sdk (>=1.20.0,<2.0.0)",
    "opentelemetry-exporter-otlp-proto-http (>=1.20.0,<2.0.0)",
    "arize-phoenix (>=13.3.0,<14.0.0)",
    "openinference-instrumentation-google-genai (>=0.1.10,<0.2.0)",
]

packages = [
    { include = "./framework" },
    { include = "./agent" }
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.ruff]
line-length = 120
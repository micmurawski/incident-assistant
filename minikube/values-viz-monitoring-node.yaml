# Schedule Linkerd Viz (Prometheus, dashboard, etc.) on the dedicated monitoring node.
# Use with: linkerd viz install -f values-viz-monitoring-node.yaml | kubectl apply -f -
# Matches aws/main.tf observability node: role=monitoring, taint dedicated=monitoring:NO_SCHEDULE.

nodeSelector:
  role: monitoring

tolerations:
  - key: dedicated
    operator: Equal
    value: monitoring
    effect: NoSchedule

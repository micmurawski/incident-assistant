grafana:
  enabled: true
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
      - name: Linkerd Prometheus
        type: prometheus
        access: proxy
        # The internal internal DNS we verified earlier
        url: http://prometheus.linkerd-viz.svc.cluster.local:9090
        isDefault: false
        jsonData:
          # Optional: align scrape interval with Linkerd defaults
          timeInterval: 5s
# Schedule o11y stack on the dedicated monitoring node (EKS).
# Matches aws/main.tf: observability node group has label role=monitoring
# and taint dedicated=monitoring:NO_SCHEDULE.
#
# Use with deploy-o11y-stack.sh when targeting EKS (e.g. DEPLOY_ON_MONITORING_NODE=1).

# --- Loki stack (Grafana / Loki / Promtail) ---
# Subcharts use different keys; set common placement for all components.

grafana:
  nodeSelector:
    role: monitoring
  tolerations:
    - key: dedicated
      operator: Equal
      value: monitoring
      effect: NoSchedule

loki:
  nodeSelector:
    role: monitoring
  tolerations:
    - key: dedicated
      operator: Equal
      value: monitoring
      effect: NoSchedule

promtail:
  nodeSelector:
    role: monitoring
  tolerations:
    - key: dedicated
      operator: Equal
      value: monitoring
      effect: NoSchedule
